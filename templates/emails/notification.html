<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ notification.title }}</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f0eb; font-family: "Segoe UI", Tahoma, sans-serif; color: #2c2416; }
    .wrapper { max-width: 560px; margin: 0 auto; padding: 32px 20px; }
    .card { background: #fff; border-radius: 16px; padding: 32px 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo span { font-family: Georgia, serif; font-size: 22px; font-weight: 700; color: #3d2e1c; }
    h1 { font-size: 18px; margin: 0 0 8px; color: #3d2e1c; }
    p { font-size: 15px; line-height: 1.6; margin: 0 0 16px; color: #5a4a36; }
    .btn { display: inline-block; padding: 12px 24px; background: #c75c2e; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 14px; }
    .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #9a8b78; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="logo"><span>Kenzory</span></div>
      <h1>{{ notification.title }}</h1>
      <p>Hi {{ user.display }},</p>
      <p>{{ notification.message }}</p>
      {% if notification.link %}
      <p style="text-align:center;margin-top:24px">
        <a class="btn" href="{{ notification.link }}">View on Kenzory</a>
      </p>
      {% endif %}
    </div>
    <div class="footer">
      Kenzory — Discover. Document. Preserve.<br>
      You received this because of activity on your account.
    </div>
  </div>
</body>
</html>
