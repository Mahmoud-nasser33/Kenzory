{% extends "base.html" %}
{% block title %}Bad request — Kenzory{% endblock %}

{% block content %}
<div class="container">
  <div class="notfound">
    <div class="big">400</div>
    <h1>That didn't make sense.</h1>
    <p style="color:var(--muted);max-width:420px;margin:0 auto 26px">
      {% if message %}{{ message }}{% else %}The request couldn't be processed — please go back and try again.{% endif %}
    </p>
    <a class="btn btn-accent" href="/">Back home</a>
  </div>
</div>
{% endblock %}
